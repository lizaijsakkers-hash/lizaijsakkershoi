
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raise the Biggest Family</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: linear-gradient(#a5e6ff, #e9faff);
    text-align: center;
    margin: 0;
    color: #333;
}

h1 {
    color: #ff70a6;
    font-size: 35px;
}

.game {
    background: white;
    margin: 30px auto;
    padding: 25px;
    border-radius: 25px;
    max-width: 450px;
    box-shadow: 0 5px 15px #999;
}

.family {
    font-size: 55px;
    margin: 25px;
}

button {
    background: #ff80ab;
    color: white;
    border: none;
    padding: 15px 25px;
    border-radius: 15px;
    font-size: 18px;
    cursor: pointer;
    margin: 10px;
}

button:hover {
    background: #ff4f91;
}

.stats {
    font-size: 20px;
    margin: 15px;
}
</style>
</head>

<body>

<h1>👨‍👩‍👧 Raise the Biggest Family 👨‍👩‍👧</h1>

<div class="game">
    <h2>Mijn familie</h2>

    <div class="family" id="family">👨‍👩‍👧</div>

    <div class="stats">
        Familieleden: <span id="count">3</span>
    </div>

    <div class="stats">
        Geld: 💰 <span id="money">0</span>
    </div>

    <button onclick="growFamily()">➕ Groei je familie!</button>
    <button onclick="earnMoney()">💰 Verdien geld</button>
</div>

<script>
let family = 3;
let money = 0;

function growFamily() {
    if (money >= 10) {
        money -= 10;
        family++;
        update();
    } else {
        alert("Je hebt 10 munten nodig!");
    }
}

function earnMoney() {
    money += 10;
    update();
}

function update() {
    document.getElementById("count").innerText = family;
    document.getElementById("money").innerText = money;

    let people = "👨‍👩‍👧";
    let extra = "👶".repeat(Math.min(family - 3, 15));
    document.getElementById("family").innerText = people + extra;
}
</script>

</body>
</html>
